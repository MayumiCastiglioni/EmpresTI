# Para a documentação detalhada de configuração, visite:
# https://supabase.com/docs/guides/local-development/cli/config
# String usada para distinguir diferentes projetos do Supabase na mesma máquina. Padrão: nome do
# diretório de trabalho ao executar `supabase init`.
project_id = "Emprest"

[api]
enabled = true
# Porta usada pela URL da API.
port = 54321
# Schemas expostos na sua API. Tabelas, views e procedimentos armazenados nesse schema receberão
# endpoints de API. Os schemas `public` e `graphql_public` são incluídos por padrão.
schemas = ["public", "graphql_public"]
# Schemas extras adicionados ao search_path de cada requisição.
extra_search_path = ["public", "extensions"]
# Número máximo de linhas retornadas de uma view, tabela ou procedimento armazenado. Limita o tamanho
# do payload em requisições acidentais ou maliciosas.
max_rows = 1000
# Controla se novas tabelas, views, sequências e funções criadas no schema `public` por `postgres`
# ficam acessíveis pelas roles da Data API (`anon`, `authenticated`, `service_role`) sem GRANTs
# explícitos, seguindo o padrão da nuvem. Defina como `false` para exigir GRANTs explícitos.
# auto_expose_new_tables = true

[api.tls]
# Ativa endpoints HTTPS localmente usando um certificado autoassinado.
enabled = false
# Caminhos para o par de certificado autoassinado.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Porta usada pela URL do banco local.
port = 54322
# Porta usada pelo comando db diff para inicializar o shadow database.
shadow_port = 54320
# Tempo máximo de espera pelo health check ao iniciar o banco local.
health_timeout = "2m"
# Versão principal do banco. Deve ser a mesma do banco remoto. Execute `SHOW
# server_version;` no banco remoto para verificar.
major_version = 17

[db.pooler]
enabled = false
# Porta usada pelo pooler de conexões local.
port = 54329
# Define quando uma conexão de servidor pode ser reutilizada por outros clientes.
# Configure um dos modos de pooler suportados: `transaction`, `session`.
pool_mode = "transaction"
# Quantas conexões de servidor permitir por par usuário/banco.
default_pool_size = 20
# Número máximo de conexões de cliente permitidas.
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# Se desativado, as migrações serão puladas durante um db push ou reset.
enabled = true
# Lista ordenada de arquivos de schema, diretórios ou padrões glob que descrevem seu banco.
# Suporta caminhos relativos ao diretório supabase: "./schemas/*.sql", "./database".
schema_paths = []

[db.seed]
# Se ativado, popula o banco após as migrações durante um db reset.
enabled = true
# Lista ordenada de arquivos de seed a carregar durante o db reset.
# Suporta padrões glob relativos ao diretório supabase: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# Ativa o gerenciamento de restrições de rede.
enabled = false
# Lista de blocos IPv4 CIDR permitidos para conectar ao banco.
# Padrão: permitir todas as conexões IPv4. Array vazio bloqueia todos os IPs.
allowed_cidrs = ["0.0.0.0/0"]
# Lista de blocos IPv6 CIDR permitidos para conectar ao banco.
# Padrão: permitir todas as conexões IPv6. Array vazio bloqueia todos os IPs.
allowed_cidrs_v6 = ["::/0"]

# Descomente para rejeitar conexões não seguras ao banco.
# [db.ssl_enforcement]
# enabled = true

[realtime]
enabled = true
# Associa o realtime via IPv4 ou IPv6. (padrão: IPv4)
# ip_version = "IPv6"
# Comprimento máximo em bytes dos cabeçalhos de requisições HTTP. (padrão: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Porta usada pelo Supabase Studio.
port = 54323
# URL externa do servidor de API ao qual o frontend se conecta.
api_url = "http://127.0.0.1"
# OpenAI API Key para usar o Supabase AI no Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Servidor de teste de e-mail. Os e-mails enviados no ambiente local não são realmente enviados -
# eles são monitorados, e você pode ver os e-mails que seriam enviados pela interface web.
[local_smtp]
enabled = true
# Porta usada pela interface web do servidor de teste de e-mail.
port = 54324
# Descomente para expor portas adicionais para testar aplicativos que enviam e-mails.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# Tamanho máximo de arquivo permitido (ex.: "5MB", "500KB").
file_size_limit = "50MiB"

# Descomente para configurar buckets de storage locais
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

# Permite conexões via clientes compatíveis com S3
[storage.s3_protocol]
enabled = true

# A API de transformação de imagem está disponível no plano Supabase Pro.
# [storage.image_transformation]
# enabled = true

# Armazena dados analíticos no S3 para executar jobs de ETL sobre o Iceberg Catalog
# Este recurso só está disponível na plataforma hospedada.
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

# Analytics Buckets está disponível no plano Supabase Pro.
# [storage.analytics.buckets.my-warehouse]

# Armazena embeddings vetoriais no S3 para conjuntos de dados grandes e duráveis
[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5

# Vector Buckets está disponível no plano Supabase Pro.
# [storage.vector.buckets.documents-openai]

[auth]
enabled = true
# URL base do seu site. Usada como allow-list para redirecionamentos e para construir URLs usadas
# nos e-mails.
site_url = "http://127.0.0.1:3000"
# URL pública que o Auth atende. Padrão: URL externa da API com `/auth/v1` anexado.
# external_url = ""
# Lista de URLs *exatas* para as quais os provedores de auth podem redirecionar após a autenticação.
additional_redirect_urls = ["https://127.0.0.1:3000"]
# Por quanto tempo os tokens são válidos, em segundos. Padrão: 3600 (1 hora), máximo 604.800 (1 semana).
jwt_expiry = 3600
# URL do emissor JWT. Se não definida, usa auth.external_url.
# jwt_issuer = ""
# Caminho para a chave de assinatura JWT. NÃO commite seus arquivos de chave no git.
# signing_keys_path = "./signing_keys.json"
# Se desativado, o refresh token nunca expira.
enable_refresh_token_rotation = true
# Permite reutilizar refresh tokens após a expiração, até o intervalo especificado em segundos.
# Requer enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Permite/nega novos cadastros de usuários no seu projeto.
enable_signup = true
# Permite/nega logins anônimos no seu projeto.
enable_anonymous_sign_ins = false
# Permite/nega o teste de vinculação manual de contas
enable_manual_linking = false
# Senhas mais curtas que este valor serão rejeitadas como fracas. Mínimo 6, recomendado 8 ou mais.
minimum_password_length = 6
# Senhas que não atendem aos requisitos abaixo serão rejeitadas como fracas. Valores suportados:
# `letters_digits`, `lower_upper_letters_digits`, `lower_upper_letters_digits_symbols`
password_requirements = ""

# Configure logins com passkey.
# [auth.passkey]
# enabled = false

# Configure as configurações da relying party WebAuthn (necessário quando o passkey está ativado).
# [auth.webauthn]
# rp_display_name = "Supabase"
# rp_id = "localhost"
# rp_origins = ["http://127.0.0.1:3000"]

[auth.rate_limit]
# Número de e-mails que podem ser enviados por hora. Requer auth.email.smtp ativado.
email_sent = 2
# Número de mensagens SMS que podem ser enviadas por hora. Requer auth.sms ativado.
sms_sent = 30
# Número de logins anônimos por hora por endereço IP. Requer enable_anonymous_sign_ins = true.
anonymous_users = 30
# Número de sessões que podem ser atualizadas em um intervalo de 5 minutos por endereço IP.
token_refresh = 150
# Número de requisições de cadastro e login em um intervalo de 5 minutos por endereço IP (exclui usuários anônimos).
sign_in_sign_ups = 30
# Número de verificações OTP / Magic link em um intervalo de 5 minutos por endereço IP.
token_verifications = 30
# Número de logins Web3 em um intervalo de 5 minutos por endereço IP.
web3 = 30

# Configure um dos provedores de captcha suportados: `hcaptcha`, `turnstile`.
# [auth.captcha]
# enabled = true
# provider = "hcaptcha"
# secret = ""

[auth.email]
# Permite/nega novos cadastros via e-mail no seu projeto.
enable_signup = true
# Se ativado, o usuário precisará confirmar qualquer mudança de e-mail nos endereços antigo e novo.
# Se desativado, apenas o novo e-mail precisa ser confirmado.
double_confirm_changes = true
# Se ativado, os usuários precisam confirmar o endereço de e-mail antes de entrar.
enable_confirmations = false
# Se ativado, os usuários precisarão reautenticar ou ter logado recentemente para mudar a senha.
secure_password_change = false
# Controla o tempo mínimo que deve passar antes de enviar outro e-mail de confirmação de cadastro ou reset de senha.
max_frequency = "1s"
# Número de caracteres usados no OTP por e-mail.
otp_length = 6
# Número de segundos antes de o OTP por e-mail expirar (padrão: 1 hora).
otp_expiry = 3600

# Use um servidor SMTP pronto para produção
# [auth.email.smtp]
# enabled = true
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "env(SENDGRID_API_KEY)"
# admin_email = "admin@email.com"
# sender_name = "Admin"

# Descomente para personalizar o template de e-mail
# [auth.email.template.invite]
# subject = "You have been invited"
# content_path = "./supabase/templates/invite.html"

# Descomente para personalizar o template de e-mail de notificação
# [auth.email.notification.password_changed]
# enabled = true
# subject = "Your password has been changed"
# content_path = "./supabase/templates/password_changed_notification.html"

[auth.sms]
# Permite/nega novos cadastros via SMS no seu projeto.
enable_signup = false
# Se ativado, os usuários precisam confirmar o número de telefone antes de entrar.
enable_confirmations = false
# Template para enviar OTP aos usuários
template = "Your code is {{ .Code }}"
# Controla o tempo mínimo que deve passar antes de enviar outro OTP por SMS.
max_frequency = "5s"

# Use um mapa pré-definido de telefone para OTP para testes.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Configure os timeouts de sessão logada.
# [auth.sessions]
# Força logout após a duração especificada.
# timebox = "24h"
# Força logout se o usuário estiver inativo por mais tempo que a duração especificada.
# inactivity_timeout = "8h"

# Este hook roda antes de um novo usuário ser criado e permite rejeitar a requisição com base no objeto de usuário recebido.
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# Este hook roda antes de um token ser emitido e permite adicionar claims extras com base no método de autenticação usado.
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# Configure um dos provedores de SMS suportados: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# NÃO commite seu auth token do Twilio no git. Use a substituição por variável de ambiente:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Multi-fator de autenticação está disponível no plano Supabase Pro.
[auth.mfa]
# Controla quantos fatores MFA podem ser inscritos por usuário de cada vez.
max_enrolled_factors = 10

# Controle MFA via App Authenticator (TOTP)
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

# Configure MFA via mensagens de telefone
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Configure MFA via WebAuthn
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# Use um provedor OAuth externo. A lista completa de provedores: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `x`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# NÃO commite o secret do provedor OAuth no git. Use a substituição por variável de ambiente:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Substitui a URL de callback padrão do auth derivada de auth.external_url.
redirect_uri = ""
# Substitui a URL padrão do provedor de auth. Usada para suportar gitlab self-hosted, Azure single-tenant,
# ou qualquer outro provedor OIDC de terceiros.
url = ""
# Se ativado, a checagem de nonce será pulada. Necessário para login local com Google auth.
skip_nonce_check = false
# Se ativado, permite ao usuário autenticar com sucesso quando o provedor não retorna um endereço de e-mail.
email_optional = false

# Permite que detentores de carteiras Solana entrem no seu projeto via o padrão Sign in with Solana (SIWS, EIP-4361).
# Você pode configurar o rate limit "web3" na seção [auth.rate_limit] e configurar [auth.captcha] se estiver self-hosting.
[auth.web3.solana]
enabled = false

# Use Firebase Auth como provedor de terceiros junto com o Supabase Auth.
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Use Auth0 como provedor de terceiros junto com o Supabase Auth.
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# Use AWS Cognito (Amplify) como provedor de terceiros junto com o Supabase Auth.
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# Use Clerk como provedor de terceiros junto com o Supabase Auth.
[auth.third_party.clerk]
enabled = false
# Obtenha em https://clerk.com/setup/supabase
# domain = "example.clerk.accounts.dev"

# Configuração do servidor OAuth
[auth.oauth_server]
# Ativa a funcionalidade do servidor OAuth
enabled = false
# Caminho da UI do fluxo de consentimento OAuth
authorization_url_path = "/oauth/consent"
# Permite registro dinâmico de clientes
allow_dynamic_registration = false

[edge_runtime]
enabled = true
# Políticas de requisição suportadas: `oneshot`, `per_worker`.
# `per_worker` (padrão) — permite hot reload durante o desenvolvimento local.
# `oneshot` — modo de fallback se o hot reload causar problemas (ex.: em repositórios grandes ou com symlinks).
policy = "per_worker"
# Porta para anexar o inspetor do Chrome para depurar edge functions.
inspector_port = 8083
# Versão principal do Deno a usar.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = true
port = 54327
# Configure um dos backends suportados: `postgres`, `bigquery`.
backend = "postgres"

# Recursos experimentais podem ser descontinuados a qualquer momento
[experimental]
# Configura o storage engine do Postgres para usar OrioleDB (S3)
orioledb_version = ""
# Configura a URL do bucket S3, ex.: <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configura a região do bucket S3, ex.: us-east-1
s3_region = "env(S3_REGION)"
# Configura a AWS_ACCESS_KEY_ID para o bucket S3
s3_access_key = "env(S3_ACCESS_KEY)"
# Configura a AWS_SECRET_ACCESS_KEY para o bucket S3
s3_secret_key = "env(S3_SECRET_KEY)"

# pg-delta é o motor de diff de schemas para db diff / db pull / db remote commit.
# Defina enabled = false para voltar ao motor legado migra.
[experimental.pgdelta]
enabled = true
# Diretório sob `supabase/` onde os arquivos declarativos são gravados.
# declarative_schema_path = "./schemas"
# String JSON passada para a formatação SQL do pg-delta. Quando omitida, o SQL é
# formatado com palavras-chave em maiúsculas, indent 2, largura máxima 180, vírgulas
# finais e alinhamento de coluna/chave. Defina como "null" para emitir SQL bruto, sem formatação.
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":180,\"commaStyle\":\"trailing\"}"